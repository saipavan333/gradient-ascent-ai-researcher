<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniGPT Name Generator</title><link rel="stylesheet" href="/static/portfolio.css"></head>
<body><main>
  <a class="back" href="/">← Portfolio</a>
  <div class="demo-head"><h1>🧬 MiniGPT Name Generator</h1></div>
  <p style="color:var(--mut)">Novel names invented in real time by a from-scratch character-level Transformer (NumPy, no framework).</p>
  <div class="controls">
    <label>How many <input id="count" type="range" min="1" max="20" value="6"><span id="cv">6</span></label>
    <label>Creativity <input id="temp" type="range" min="0.3" max="1.4" step="0.1" value="0.9"><span id="tv">0.9</span></label>
    <label>Starts with <input id="prefix" type="text" maxlength="8" placeholder="e.g. al"></label>
    <button id="go">Generate ✨</button>
  </div>
  <ul id="results" class="results"></ul>
<script>
const $=s=>document.querySelector(s), count=$("#count"), temp=$("#temp");
count.oninput=()=>$("#cv").textContent=count.value; temp.oninput=()=>$("#tv").textContent=temp.value;
async function go(){$("#go").disabled=true;$("#results").innerHTML="<li>thinking…</li>";
 const r=await fetch(`/namegen/api/generate?count=${count.value}&temperature=${temp.value}&prefix=${encodeURIComponent($("#prefix").value)}`);
 const d=await r.json();$("#results").innerHTML=d.names.map(n=>`<li>${n}</li>`).join("");$("#go").disabled=false;}
$("#go").onclick=go;$("#prefix").addEventListener("keydown",e=>{if(e.key==="Enter")go();});go();
</script></main></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Descent Lab</title><link rel="stylesheet" href="/static/portfolio.css"></head>
<body><main>
  <a class="back" href="/">← Portfolio</a>
  <div class="demo-head"><h1>📉 Double Descent Lab</h1></div>
  <p style="color:var(--mut)">A live reproduction of double descent. Grow the model past the interpolation threshold (P=n) and test error spikes, then falls again. Move the sliders.</p>
  <div class="controls">
    <label>Label noise <input id="noise" type="range" min="0" max="1.5" step="0.05" value="0.5"><span id="nv">0.50</span></label>
    <label>Ridge λ <input id="ridge" type="range" min="-7" max="0.5" step="0.25" value="-6"><span id="rv">1e-6</span></label>
    <button id="go">Recompute</button>
  </div>
  <div id="status" class="status"></div>
  <img id="plot" alt="double descent curve">
<script>
const $=s=>document.querySelector(s), noise=$("#noise"), ridge=$("#ridge");
noise.oninput=()=>$("#nv").textContent=(+noise.value).toFixed(2);
ridge.oninput=()=>$("#rv").textContent=Math.pow(10,+ridge.value).toExponential(0);
async function go(){$("#go").disabled=true;$("#status").textContent="computing…";
 const r=await fetch(`/ddlab/api/curve?noise=${noise.value}&ridge=${Math.pow(10,+ridge.value)}`);
 const d=await r.json();$("#plot").src="data:image/png;base64,"+d.image;
 $("#status").textContent=`peak error ${d.peak_error} at P/n ≈ ${d.peak_ratio}`;$("#go").disabled=false;}
$("#go").onclick=go;go();
</script></main></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL GridWorld — Live</title><link rel="stylesheet" href="/static/portfolio.css"></head>
<body><main>
  <a class="back" href="/">← Portfolio</a>
  <div class="demo-head"><h1>🤖 GridWorld — watch it learn</h1></div>
  <p style="color:var(--mut)">A Q-learning agent learning to reach the goal (and avoid the pit) by trial and error. Click Train and watch values and policy sharpen.</p>
  <div class="bar">
    <button id="train">Train 200 ▶</button>
    <button id="auto">Auto ⏩</button>
    <button id="reset" class="ghost">Reset ↺</button>
    <span id="stat" class="stat"></span>
  </div>
  <div id="grid" class="grid"></div>
  <p style="color:var(--mut);font-size:.8rem;margin-top:1rem">green = goal +1 · red = pit −1 · arrows = best action · cell color = state value</p>
<script>
const A={up:"↑",down:"↓",left:"←",right:"→"};
function color(v){const t=Math.max(0,Math.min(1,(v+0.2)/1.2));return `rgb(${Math.round(220-160*t)},${Math.round(70+150*t)},90)`;}
function render(s){const g=document.getElementById("grid");g.style.gridTemplateColumns=`repeat(${s.cols},1fr)`;
 g.innerHTML=s.cells.map(c=>{if(c.kind==="wall")return`<div class="c wall"></div>`;
  if(c.kind==="goal")return`<div class="c goal">GOAL<br>+1</div>`;if(c.kind==="pit")return`<div class="c pit">PIT<br>−1</div>`;
  return`<div class="c" style="background:${color(c.value)}"><span class="ar">${A[c.policy]||""}</span><span class="v">${c.value.toFixed(2)}</span></div>`;}).join("");
 document.getElementById("stat").textContent=`episodes: ${s.episodes} · return: ${s.return}`;}
const call=p=>fetch(p).then(r=>r.json());
const train=()=>call("/gridworld/api/train?episodes=200").then(render);
document.getElementById("train").onclick=train;
document.getElementById("reset").onclick=()=>call("/gridworld/api/reset").then(render);
let t=null;document.getElementById("auto").onclick=function(){if(t){clearInterval(t);t=null;this.textContent="Auto ⏩";return;}this.textContent="Stop ⏸";t=setInterval(train,600);};
call("/gridworld/api/state").then(render);
</script></main></body></html>
